<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <style>.light{display:none}@media (prefers-color-scheme: light){.dark{display:none}.light{display:inline}}</style>
  <defs><linearGradient id="tile" x1="0.3415" y1="-0.0915" x2="0.6585" y2="1.0915"><stop offset="0" stop-color="#2A3244"/><stop offset="0.55" stop-color="#12151E"/><stop offset="1" stop-color="#08090D"/></linearGradient>
    <radialGradient id="mint" cx="0.5" cy="0.22" r="0.7" gradientTransform="translate(0.5 0.22) scale(1 0.7857) translate(-0.5 -0.22)"><stop offset="0" stop-color="#2BFFB8" stop-opacity="0.22"/><stop offset="0.7" stop-color="#2BFFB8" stop-opacity="0"/></radialGradient>
    <filter id="islandGlow" x="-50%" y="-50%" width="200%" height="300%"><feDropShadow dx="0" dy="3" stdDeviation="5.0" flood-color="#2BFFB8" flood-opacity="0.28"/></filter>
    <filter id="lineGlow" x="-50%" y="-300%" width="200%" height="700%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect width="64" height="64" rx="14"/></clipPath><linearGradient id="tileL" x1="0.3415" y1="-0.0915" x2="0.6585" y2="1.0915"><stop offset="0" stop-color="#F2F5F8"/><stop offset="1" stop-color="#D3DAE2"/></linearGradient>
    <radialGradient id="mintL" cx="0.5" cy="0.22" r="0.7" gradientTransform="translate(0.5 0.22) scale(1 0.7857) translate(-0.5 -0.22)"><stop offset="0" stop-color="#2BFFB8" stop-opacity="0.14"/><stop offset="0.7" stop-color="#2BFFB8" stop-opacity="0"/></radialGradient>
    <filter id="islandGlowL" x="-50%" y="-50%" width="200%" height="300%"><feDropShadow dx="0" dy="3" stdDeviation="5.0" flood-color="#2BFFB8" flood-opacity="0.28"/></filter>
    <filter id="lineGlowL" x="-50%" y="-300%" width="200%" height="700%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clipL"><rect width="64" height="64" rx="14"/></clipPath></defs>
  <g class="dark"><g clip-path="url(#clip)">
